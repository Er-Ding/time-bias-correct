[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-bias-localization"
version = "0.1.0"
description = "二维多径定位与公共到达时间偏差联合估计"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.8"]
gpu = ["cupy-cuda12x==13.6.0"]
simulation = ["deepmimo[sionna]"]
test = ["pytest>=8"]

[project.scripts]
time-bias-localize = "time_bias_localization.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
