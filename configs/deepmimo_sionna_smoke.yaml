# Munich 小规模连通性验证。只验证真实 API、场景转换和数据契约，不作为正式实验。

project:
  random_seed: 20260905

scene:
  source: sionna_builtin
  name: munich
  fixed_height_m: 1.5
  bev_resolution_m: 0.20
  # 固定定位地图，不允许 UE 真值或真实路径交互点改变裁剪范围。
  localization_bounds_m: [-100.0, 160.0, -80.0, 180.0]
  max_reflections: 2
  vertical_path_tolerance_m: 0.10

radio:
  carrier_hz: 3.5e9
  bandwidth_hz: 400.0e6
  num_subcarriers: 512
  num_bs_antennas: 12
  antenna_spacing_wavelength: 0.5
  # 将直射与最强墙面反射都转到阵列正面的中间角度，避免它们落在
  # ±90° 端射方向附近而产生均匀线阵的空间混叠。
  bs_boresight_deg: -45.0
  front_facing_only: true
  num_snapshots: 1
  snr_db: 35.0

simulation:
  bs_position_m: [20.0, 50.0]
  # 选择 Munich 中同一条开阔街区内的点，二维投影下直射不穿墙，且有
  # 一条角度可分辨的墙面反射，适合验证第一版二维模型。
  ue_position_m: [50.0, 50.0]
  clock_bias_s: 25.0e-9
  samples_per_source: 20000
  max_num_paths_per_source: 10000
  deepmimo_scenario_name: time_bias_munich_smoke_run11
  deepmimo_lossless_scene: true
  allow_overwrite: false

music:
  num_paths: 3
  # 当前站点 10 条二维路径经阵列正面角度窗筛选后保留 6 条；只输出 3 个峰。
  signal_subspace_rank: 6
  angle_min_deg: -89.0
  angle_max_deg: 89.0
  angle_step_deg: 1.0
  delay_min_s: 0.0
  # 512 个等间隔子载波横跨 400 MHz，无混叠时延约 1.28 us；这里覆盖
  # 本次最多二次反射的 1.05 us 观测时延，同时不搜索周期副本。
  delay_max_s: 1150.0e-9
  delay_step_s: 1.0e-9
  min_angle_separation_deg: 5.0
  min_delay_separation_s: 3.0e-9
  # 每份接收 CSI 的谱面采样；半宽以原始搜索网格步长为单位。
  spectrum_sampling:
    samples_per_peak: 128
    aoa_half_width_grid_steps: 1.5
    delay_half_width_grid_steps: 1.5
    local_grid_points_per_axis: 25
    spectrum_power: 1.0
    uniform_mixture: 0.1
    include_nominal: true
  spatial_subarray_size: 8
  frequency_subarray_size: 64
  diagonal_loading: 1.0e-8

localization:
  bias_min_s: -80.0e-9
  bias_max_s: 80.0e-9
  candidate_cluster_radius_m: 1.5
  candidate_direction_radius_deg: 5.0
  huber_delta_m: 0.75
  max_iterations: 20

output:
  root: outputs/deepmimo_sionna_smoke_run11
