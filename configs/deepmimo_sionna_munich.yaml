# DeepMIMO V4 + Sionna RT 正式仿真入口。
# BS 和 UE 固定在同一高度，只保留可投影到二维的路径。

project:
  random_seed: 20260904

scene:
  source: sionna_builtin
  name: munich
  fixed_height_m: 1.5
  bev_resolution_m: 0.10
  # 固定定位地图，不允许 UE 真值或真实路径交互点改变裁剪范围。
  localization_bounds_m: [-100.0, 160.0, -80.0, 180.0]
  max_reflections: 2
  vertical_path_tolerance_m: 0.10

radio:
  carrier_hz: 3.5e9
  bandwidth_hz: 400.0e6
  # 512 点在 400 MHz 下提供约 1.28 us 的无混叠时延范围。
  num_subcarriers: 512
  num_bs_antennas: 12
  antenna_spacing_wavelength: 0.5
  bs_boresight_deg: -45.0
  front_facing_only: true
  num_snapshots: 1
  snr_db: 35.0

simulation:
  # Munich 开阔街区中的已验证起始点；正式扫点时由 UE 列表替换。
  bs_position_m: [20.0, 50.0]
  ue_position_m: [50.0, 50.0]
  clock_bias_s: 25.0e-9
  samples_per_source: 2000000
  max_num_paths_per_source: 100000
  deepmimo_scenario_name: time_bias_munich_uplink
  deepmimo_lossless_scene: true
  allow_overwrite: false

music:
  num_paths: 3
  # 与 smoke 使用同一站点和阵列正面范围，先按已验证的 6 个有效模式建模。
  signal_subspace_rank: 6
  angle_min_deg: -89.0
  angle_max_deg: 89.0
  angle_step_deg: 1.0
  delay_min_s: 0.0
  delay_max_s: 1150.0e-9
  delay_step_s: 1.0e-9
  min_angle_separation_deg: 5.0
  min_delay_separation_s: 3.0e-9
  # 峰集合整体配对：允许虚假峰不配对，漏检惩罚更高。
  association_max_normalized_distance: 3.0
  false_peak_penalty: 4.0
  missed_peak_penalty: 9.0
  uncertainty_repeats: 12
  uncertainty_extra_peaks: 2
  uncertainty_min_relative_height: 1.0e-5
  uncertainty_noise_scale: 0.35
  spatial_subarray_size: 8
  frequency_subarray_size: 64
  diagonal_loading: 1.0e-8

localization:
  bias_min_s: -80.0e-9
  bias_max_s: 80.0e-9
  candidate_cluster_radius_m: 1.5
  candidate_direction_radius_deg: 5.0
  huber_delta_m: 0.75
  max_iterations: 20

output:
  root: outputs/deepmimo_sionna_munich
